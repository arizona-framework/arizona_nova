name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: Taure/erlang-ci/.github/workflows/ci.yml@v2.0.5
    with:
      otp-version: '29'
      enable-ct: true
      enable-audit: false
      enable-coverage: true
      enable-ex-doc: true
      enable-sbom: true
      enable-sbom-scan: true
      enable-summary: true
      enable-dependency-submission: true

  example:
    name: Example
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24
        with:
          otp-version: '29'
          rebar3-version: '3'

      # The example runs the arizona_nova it sits beside, not the published one.
      - name: Boot and drive the example
        working-directory: example
        run: |
          mkdir -p _checkouts
          ln -s ../.. _checkouts/arizona_nova
          rebar3 ct
